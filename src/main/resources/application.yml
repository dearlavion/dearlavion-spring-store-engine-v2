spring:
  config:
    # Loads MONGODB_URI (and any other secrets) from a gitignored .env in the project root, so the
    # Atlas connection string never has to be passed as a plaintext env var/CLI arg (visible via
    # `ps`) or committed to this file.
    import: optional:file:.env[.properties]
  data:
    mongodb:
      # Separate dev DB during Phases 1-3 (not the shared prod-ish DB the live NestJS
      # service uses) — deliberately avoids polluting real data with iterative test writes.
      # Point at the shared DB only for the Phase 4 parity diff, right before cutover.
      # No localhost fallback: every environment, dev included, runs against the Atlas cluster.
      # MONGODB_URI comes from the gitignored .env above (or the environment) and is required —
      # startup fails loudly rather than silently writing to a local Mongo nobody else can see.
      uri: ${MONGODB_URI}
      # Indexes already exist on the shared DB (created by the original NestJS/Mongoose service),
      # often under different auto-generated names for the same key pattern (e.g. Mongoose's
      # "userId_1" vs Spring Data's default "userId") — auto-creation on startup would either
      # collide with those (IndexOptionsConflict) or silently declare parallel indexes. Let the
      # existing indexes serve as the constraint layer instead of re-declaring them here.
      auto-index-creation: false
  main:
    allow-circular-references: true
  servlet:
    # Spring's 1MB default would reject admin/media/drive/upload's multipart body (an image
    # forwarded to media-service, which enforces the real size cap) well below anything
    # media.max-image-size-kb would realistically be set to.
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${PORT:4010}
  address: 0.0.0.0

app:
  auth-server-url: ${AUTH_SERVER_URL:http://localhost:8081}
  # Empty = tenant check disabled, matching the NestJS default.
  expected-customer: ${EXPECTED_CUSTOMER:}
  admin-usernames: ${ADMIN_USERNAMES:admin}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  # dearlavion-notification-service — sends the newsletter "thanks for subscribing" email.
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
  # Must match notification-service's own INTERNAL_API_KEY (defaults match for local dev).
  internal-api-key: ${INTERNAL_API_KEY:travelbesty-internal-dev-key}
  # dearlavion-spring-media-service — presigned-upload-URL broker for admin product/kit photos.
  media-service-url: ${MEDIA_SERVICE_URL:http://localhost:8085}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
